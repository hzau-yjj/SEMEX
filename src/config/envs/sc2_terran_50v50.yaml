env: sc2

env_args:
  map_name: "8m"
  step_mul: 8
  move_amount: 2
  difficulty: "7"
  game_version: null
  seed: null
  continuing_episode: false
  obs_all_health: true
  obs_own_health: true
  obs_last_action: false
  obs_pathing_grid: false
  obs_terrain_height: false
  obs_instead_of_state: false
  obs_timestep_number: false
  obs_own_pos: false
  obs_starcraft: true
  conic_fov: false
  num_fov_actions: 12
  state_last_action: true
  state_timestep_number: false
  reward_sparse: false
  reward_only_positive: true
  reward_death_value: 10
  reward_win: 200
  reward_defeat: 0
  reward_negative_scale: 0.5
  reward_scale: true
  reward_scale_rate: 20
  use_unit_ranges: false
  min_attack_range: 2
  kill_unit_step_mul: 2
  fully_observable: false
  capability_config: {
            "n_units": 50,
            "n_enemies": 50,
            "team_gen": {
                "dist_type": "weighted_teams",
                "unit_types": ["marine", "marauder", "medivac"],
                "weights": [1.0, 0, 0],
                "observe": True
            },
            "start_positions": {
                "dist_type": "surrounded_and_reflect",
                "p": 0.5,
                "map_x": 32,
                "map_y": 32
            }
        }
  replay_dir: ""
  replay_prefix: ""
  window_size_x: 1920
  window_size_y: 1200
  heuristic_ai: false
  heuristic_rest: false
  debug: false
  prob_obs_enemy: 1.0
  action_mask: true


learner_log_interval: 10000
log_interval: 10000
runner_log_interval: 10000
t_max: 5050000
test_interval: 10000
test_nepisode: 20
test_greedy: True
